name: Set Watch regression tests
on:
  push:
    paths:
      - "src/set-watch.js"
      - "functions/api/set-previews.js"
      - "set-watch.html"
      - "set-watch.js"
      - "set-watch.css"
      - "tests/set-watch.test.mjs"
      - ".github/workflows/set-watch-tests.yml"
  pull_request:
    paths:
      - "src/set-watch.js"
      - "functions/api/set-previews.js"
      - "set-watch.html"
      - "set-watch.js"
      - "set-watch.css"
      - "tests/set-watch.test.mjs"
      - ".github/workflows/set-watch-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Check Set Watch logic and endpoint
        run: node --experimental-default-type=module --test tests/set-watch.test.mjs
