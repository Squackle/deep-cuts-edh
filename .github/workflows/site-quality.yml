name: Site quality and navigation
on:
  push:
    branches: [main, "fix/audit-five-20261014"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO, accessibility, navigation and existing-feature guards
        run: node scripts/site-release-check.mjs
      - name: Strict sitemap, crawlability and AdSense readiness checks
        run: node --experimental-default-type=module --test tests/seo-readiness.test.mjs
      - name: Lean homepage navigation regression tests
        run: node --test tests/home-hub.test.mjs
      - name: Artist catalog matching, Scryfall API caching, and library facet contract tests
        run: |
          node --experimental-default-type=module --test tests/artist-suggestions.test.mjs
          node --experimental-default-type=module --test tests/library-query.test.mjs
          node --experimental-default-type=module --test tests/library-facets.test.mjs
          node --check artist-autocomplete.js
          node --check functions/api/artist-suggest.js
      - name: Commander Finder and Binder security / deck regression tests
        run: node --experimental-default-type=module --test tests/deep-tools.test.mjs
      - name: Commander tool syntax checks
        run: |
          node --check deep-tools.js
          node --check deep-tools-core.js
          node --check functions/api/tool-cards.js
      - name: Compact desktop and mobile navigation regression tests
        run: node --test tests/header-navigation.test.mjs
      - name: Community and My Profile separation checks
        run: node --test tests/profile-separation.test.mjs
      - name: Community and Profile browser script syntax
        run: |
          node --check community.js
          node --check field-expansion.js
          node --check header-profile.js
      - name: Featured case, server submission guards and sitewide visual polish tests
        run: node --experimental-default-type=module --test tests/featured-case-polish.test.mjs
      - name: Featured challenge server syntax checks
        run: |
          node --check src/featured-case.js
          node --check src/community-games.js
          node --check src/community-read.js
          node --check community-features.js
      - name: Four-game signed-in and anonymous practice round regression tests
        run: node --experimental-default-type=module --test tests/practice-games.test.mjs
      - name: Practice server and game client syntax checks
        run: |
          node --check daily-games.js
          node --check arcane-games.js
          node --check src/automated-games.js
          node --check functions/api/arcane-games.js
      - name: Install isolated Chromium test driver
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.56.1
      - name: Hive Run real-browser startup and controls (mobile and desktop)
        run: node --test tests/hive-run-browser.test.mjs
      - name: Rescue Board static integration and script syntax
        run: |
          node --test tests/rescue-board.test.mjs
          node --check rescue-board.js
          node --check nomination.js
          node --check reports/guide.js
      - name: Rescue Board real-browser mobile and desktop regression
        run: node --test tests/rescue-board-browser.test.mjs
      - name: Arcade journey contracts and syntax checks
        run: |
          node --test tests/arcade-journey.test.mjs
          node --check arcade-journey.js
          node --check daily-games.js
          node --check arcane-games.js
      - name: Arcade journey mobile and desktop real-browser regression
        run: node --test tests/arcade-journey-browser.test.mjs
      - name: Mobile homepage header and footer browser regression tests
        run: node --experimental-default-type=module --test tests/mobile-home-browser.test.mjs
      - name: Mobile and desktop Library artist autocomplete browser tests
        run: node --experimental-default-type=module --test tests/library-artist-browser.test.mjs
      - name: Browser interaction tests for all four Arcade practice games
        run: node --experimental-default-type=module --test tests/practice-browser.test.mjs
      - name: Privacy-first supporter ribbon and commander preview regression tests
        run: node --experimental-default-type=module --test tests/supporter-ticker-card-preview.test.mjs
      - name: Supporter API and card-preview syntax
        run: |
          node --check functions/api/supporter-ticker.js
          node --check supporter-ticker-settings.js
          node --check daily-games.js
          node --check header-profile.js
      - name: Magic daily game regression suite
        run: |
          node --experimental-default-type=module --test tests/arcane-daily.test.mjs
          node --experimental-default-type=module --test tests/arcane-hints.test.mjs
      - name: Owner console controls and security contract regression tests
        run: |
          node --test tests/owner-dashboard.test.mjs
          node --check owner-dashboard.js
          node --check member-operations.js
          node --check owner-console.js
          node --check owner-evidence.js
          node --check owner-adfree.js
      - name: Owner command center real-browser interaction checks
        run: node --test tests/owner-dashboard-browser.test.mjs
      - name: Complete owner command center action flow browser regression tests
        run: node --test tests/owner-actions-browser.test.mjs
      - name: Owner Command Center 2.0 responsive admin browser tests
        run: node --test tests/owner-v2-browser.test.mjs
      - name: Owner 2.0 API syntax and contract checks
        run: |
          node --check owner-v2.js
          node --check functions/api/owner-ops.js
          node --test tests/owner-v2-contract.test.mjs
      - name: Owner nominations read-and-approval API regression tests
        run: node --test tests/owner-nominations-api.test.mjs
      - name: Issue 38 targeted DOM XSS browser regressions
        run: node --test tests/security-dom-injection.test.mjs
      - name: Issue 38 synthetic identity and Ko-fi replay checks
        run: node --test tests/security-identity-isolation.test.mjs tests/security-kofi-replay.test.mjs
      - name: Public-site and protected-owner HTTP smoke checks
        run: node --test tests/owner-access-smoke.test.mjs
      - name: JavaScript syntax
        run: |
          node --check arcane-games.js
          node --check daily-games.js
          node --check header-profile.js
          node --check set-watch.js
          node --check functions/api/arcane-games.js
          node --check functions/api/daily-games.js
