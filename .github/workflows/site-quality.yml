name: Site quality and navigation
on:
  push:
    branches: [main, "fix/audit-five-20261014"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  site-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: SEO, accessibility, navigation and existing-feature guards
        run: node scripts/site-release-check.mjs
      - name: Lean homepage navigation regression tests
        run: node --test tests/home-hub.test.mjs
      - name: Commander Finder and Binder security / deck regression tests
        run: node --experimental-default-type=module --test tests/deep-tools.test.mjs
      - name: Commander tool syntax checks
        run: |
          node --check deep-tools.js
          node --check deep-tools-core.js
          node --check functions/api/tool-cards.js
      - name: Compact desktop and mobile navigation regression tests
        run: node --test tests/header-navigation.test.mjs
      - name: Community and My Profile separation checks
        run: node --test tests/profile-separation.test.mjs
      - name: Community and Profile browser script syntax
        run: |
          node --check community.js
          node --check field-expansion.js
          node --check header-profile.js
      - name: Featured case, server submission guards and sitewide visual polish tests
        run: node --experimental-default-type=module --test tests/featured-case-polish.test.mjs
      - name: Featured challenge server syntax checks
        run: |
          node --check src/featured-case.js
          node --check src/community-games.js
          node --check src/community-read.js
          node --check community-features.js
      - name: Four-game signed-in and anonymous practice round regression tests
        run: node --experimental-default-type=module --test tests/practice-games.test.mjs
      - name: Practice server and game client syntax checks
        run: |
          node --check daily-games.js
          node --check arcane-games.js
          node --check src/automated-games.js
          node --check functions/api/arcane-games.js
      - name: Magic daily game regression suite
        run: node --experimental-default-type=module --test tests/arcane-daily.test.mjs
      - name: JavaScript syntax
        run: |
          node --check arcane-games.js
          node --check daily-games.js
          node --check header-profile.js
          node --check set-watch.js
          node --check functions/api/arcane-games.js
          node --check functions/api/daily-games.js
