name: Locked dependency audit
on:
  schedule:
    - cron: '41 14 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/dependency-audit.yml'
permissions:
  contents: read
concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  npm-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Audit locked development and transitive dependencies
        run: npm audit --package-lock-only --audit-level=high
