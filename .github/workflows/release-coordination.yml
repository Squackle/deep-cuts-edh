name: Release coordination
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  complete-local-audit:
    uses: ./.github/workflows/audit-tests.yml
    permissions:
      contents: read

  release-coordination:
    needs: complete-local-audit
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every isolated audit matrix job to succeed
        env:
          AUDIT_RESULT: ${{ needs.complete-local-audit.result }}
        run: test "$AUDIT_RESULT" = "success"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify collision checker contract
        run: node --test tests/release-coordination.test.mjs
      - name: Verify PR ownership, promotion evidence and concurrent changes
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release-coordination.mjs
