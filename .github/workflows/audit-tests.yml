name: Complete local audit tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: audit-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, workers, browser]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install pinned browser
        if: matrix.suite == 'browser'
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Verify isolated suite
        run: npm run test:${{ matrix.suite }}
      - name: Static site release checks
        if: matrix.suite == 'unit'
        run: npm run check
