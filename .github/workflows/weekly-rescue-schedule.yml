name: Weekly Rescue schedule regression
on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/weekly-rescue-schedule.json'
      - 'src/weekly-rescue*.js'
      - 'src/home-weekly-ssr.js'
      - 'functions/index.js'
      - 'functions/rescues/**'
      - 'index.html'
      - 'tests/weekly-rescue-*.test.mjs'
      - 'tests/helpers/strong-article.mjs'
      - 'workers/weekly-rescue-publisher.js'
      - 'tests/weekly-rescue-schedule.test.mjs'
      - 'tests/weekly-rescue-publisher-reliability.test.mjs'
      - '.github/workflows/weekly-rescue-schedule.yml'
  push:
    branches: [main]
    paths:
      - 'workers/weekly-rescue-schedule.json'
      - 'src/weekly-rescue*.js'
      - 'src/home-weekly-ssr.js'
      - 'functions/index.js'
      - 'functions/rescues/**'
      - 'index.html'
      - 'tests/weekly-rescue-*.test.mjs'
      - 'tests/helpers/strong-article.mjs'
      - 'workers/weekly-rescue-publisher.js'
      - 'tests/weekly-rescue-schedule.test.mjs'
      - 'tests/weekly-rescue-publisher-reliability.test.mjs'
      - '.github/workflows/weekly-rescue-schedule.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  weekly-rescue-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify Friday Cron schedules, publisher quality floor, archive and homepage feature
        run: |
          node --test tests/weekly-rescue-schedule.test.mjs tests/weekly-rescue-publisher-reliability.test.mjs
          node --import ./tests/helpers/offline.mjs --test tests/weekly-rescue-pipeline.test.mjs tests/weekly-rescue-archive.test.mjs
          node --check workers/weekly-rescue-publisher.js
